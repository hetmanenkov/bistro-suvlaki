<!doctype html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Bistro Suvlaki</title>

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <main class="admin-login">
        <h1>Bistro Suvlaki</h1>
        <h2>Administrácia</h2>

        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Heslo"
                required
            >

            <button type="submit">
                Prihlásiť sa
            </button>

            <p id="login-error"></p>

        </form>
    </main>

    <script type="module" src="/src/admin.js"></script>

</body>
</html>
